name: Web

# Builds the Astro site in web/ and deploys it to Cloudflare Workers static assets on https://wavi.hrkmtsmt.dev (web/wrangler.jsonc). Runs only when the site or this workflow changes. Pull requests only check that it builds; main deploys it.
# Needs the repository secrets CLOUDFLARE_API_TOKEN (allowed to deploy Workers and their custom domains) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/web.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx astro check
      - run: npm test
      - run: npm run build

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          wranglerVersion: "4.168.0"
          command: deploy
