name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep these in step with the Xcode and SwiftLint used locally, so the
  # linters and the compiler give the same answers here as on a Mac.
  XCODE_APP: /Applications/Xcode_27.1.app
  SWIFTLINT_VERSION: 0.65.1

jobs:
  check:
    # The Xcode 27 image is in public preview on GitHub-hosted runners.
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Install tools
        run: |
          brew install xcodegen
          curl -sSfL -o "$RUNNER_TEMP/swiftlint.zip" \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          echo "$RUNNER_TEMP/swiftlint" >> "$GITHUB_PATH"

      - name: swift-format
        run: swift format lint --strict --recursive Wavi WaviTests

      - name: SwiftLint
        run: swiftlint lint --strict --quiet --reporter github-actions-logging

      - name: Build and test
        run: |
          xcodegen generate
          xcodebuild test \
            -project Wavi.xcodeproj \
            -scheme Wavi \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO
